<title>Campo de Girasoles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Escena soleada de día (tema único por diseño): cielo cálido arriba, campo de girasoles abajo, corazones amarillos subiendo */
  :root{
    color-scheme: light;
    --sky-top:#8fd0f0;
    --sky-mid:#cfeeff;
    --sky-low:#fff3d6;
    --sun:#ffd24a;
    --sun-glow:#ffe79a;
    --petal:#ffc81f;
    --petal-dark:#f0a81b;
    --center:#6e4523;
    --center-dot:#59341a;
    --stem:#4f9a3e;
    --leaf:#5fae45;
    --heart:#ffcf33;
    --heart-soft:#ffd95e;
    --fg:#5a3b12;
    --card:rgba(255,255,255,.72);
    --card-border:rgba(240,168,27,.5);
    --box-light:#f6bb24;
    --box:#e6a417;
    --box-dark:#c3850f;
    --font-display:"Baloo 2","Trebuchet MS",sans-serif;
    --font-body:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:var(--font-body);color:var(--fg);
    background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-mid) 42%,var(--sky-low) 100%);
    overflow:hidden;-webkit-font-smoothing:antialiased;
  }

  /* ---------- Escena ---------- */
  #scene{position:fixed;inset:0;overflow:hidden}
  .sun{position:absolute;top:8%;right:14%;width:96px;height:96px;border-radius:50%;background:var(--sun);box-shadow:0 0 60px 24px var(--sun-glow),0 0 120px 60px rgba(255,231,154,.5);animation:sunpulse 6s ease-in-out infinite}
  @keyframes sunpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .cloud{position:absolute;background:#fff;border-radius:50px;opacity:.85;filter:blur(.3px)}
  .cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
  .c1{top:16%;left:10%;width:120px;height:30px;animation:drift 38s linear infinite}
  .c1::before{width:50px;height:50px;top:-22px;left:18px}
  .c1::after{width:38px;height:38px;top:-14px;left:60px}
  .c2{top:26%;left:55%;width:90px;height:24px;animation:drift 52s linear infinite}
  .c2::before{width:38px;height:38px;top:-16px;left:14px}
  .c2::after{width:30px;height:30px;top:-10px;left:46px}
  @keyframes drift{from{transform:translateX(-20vw)}to{transform:translateX(120vw)}}

  #hearts{position:absolute;inset:0;pointer-events:none;z-index:3}

  .ground{position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(180deg,#7ec24f,#4f9a3e);z-index:2}
  #field{position:absolute;left:0;right:0;bottom:0;height:62%;z-index:4;pointer-events:none}
  .sunflower{position:absolute;bottom:0;transform-origin:bottom center;will-change:transform}
  .stem{position:absolute;left:50%;bottom:0;width:7px;transform:translateX(-50%);background:var(--stem);border-radius:4px}
  .leaf{position:absolute;width:26px;height:16px;background:var(--leaf);border-radius:0 60% 0 60%;left:50%}
  .head{position:absolute;left:50%;transform:translateX(-50%)}
  @keyframes sway{0%,100%{transform:rotate(var(--a))}50%{transform:rotate(calc(var(--a) * -1))}}

  /* mensaje */
  .msg{position:absolute;z-index:5;left:50%;top:12%;transform:translateX(-50%);width:min(88%,360px);text-align:center;background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:16px 18px;backdrop-filter:blur(3px);box-shadow:0 8px 30px rgba(180,120,10,.18)}
  .msg h1{font-family:var(--font-display);font-size:26px;font-weight:700;margin:0 0 4px;color:#b9770c}
  .msg p{margin:0;font-size:14.5px;line-height:1.6;color:var(--fg)}

  /* botón música */
  .music-btn{position:fixed;z-index:6;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;border:none;background:var(--box-light);color:#6e4523;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 18px rgba(180,120,10,.35)}
  .music-btn svg{width:22px;height:22px}
  .music-btn:active{transform:scale(.94)}

  /* ---------- Caja (apertura) ---------- */
  html.lock{overflow:hidden}
  #gift{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;
    padding:calc(28px + env(safe-area-inset-top,0px)) 28px calc(28px + env(safe-area-inset-bottom,0px));
    background:radial-gradient(900px 540px at 50% 34%, #ffe9ad 0%, #ffd98f 55%, #ffca63 100%);
    transition:opacity 1s ease,visibility 1s ease}
  #gift.gone{opacity:0;visibility:hidden}
  .box{width:200px;height:200px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;outline:none;filter:drop-shadow(0 14px 22px rgba(160,105,10,.35))}
  .box.shake{animation:shake .4s ease}
  @keyframes shake{0%,100%{transform:translateX(0) rotate(0)}20%{transform:translateX(-5px) rotate(-3deg)}40%{transform:translateX(5px) rotate(3deg)}60%{transform:translateX(-4px) rotate(-2deg)}80%{transform:translateX(4px) rotate(2deg)}}
  #lid{transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .5s ease}
  .g-title{font-family:var(--font-display);font-size:25px;font-weight:700;color:#8a5a0c;margin:0}
  .g-sub{font-size:14.5px;color:#9a6a12;margin:0;max-width:270px;line-height:1.55}
  .g-progress{display:flex;gap:9px}
  .g-progress svg{width:21px;height:21px;color:#e6a417;opacity:.28;transition:opacity .3s ease,transform .3s cubic-bezier(.34,1.56,.64,1)}
  .g-progress svg.on{opacity:1;transform:scale(1.22)}
  .g-count{font-size:13px;color:#a97516;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .g-message{max-width:330px;background:var(--card);border:1px solid var(--card-border);border-radius:16px;padding:14px 17px;font-size:14.5px;line-height:1.65;color:var(--fg);box-shadow:0 6px 20px rgba(180,120,10,.15)}
  @media (prefers-reduced-motion:reduce){.sun,.cloud,.sunflower,.box.shake{animation:none}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600;700&display=swap">

<!-- ================= ESCENA ================= -->
<div id="scene" aria-hidden="true">
  <div class="sun"></div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <canvas id="hearts"></canvas>
  <div class="ground"></div>
  <div id="field"></div>
  <div class="msg">
    <h1 id="msg-title">With love for my darling 🌻</h1>
    <p id="msg-text">♪ We Fell in Love in October — girl in red</p>
  </div>
</div>

<button class="music-btn" id="music-btn" type="button" aria-label="Música">
  <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
</button>
<audio id="bg-audio" loop preload="metadata" src="assets/cancion.mp3"></audio>

<!-- ================= CAJA ================= -->
<div id="gift" role="dialog" aria-label="Abrir regalo">
  <div class="g-message">Buenos días Ally 🌻 Espero que tengas un bonito día y puedas disfrutar de tus clases virtuales jsjs. Te quiero mucho y espero que te gusten mis pequeñas sorpresas… &lt;3</div>
  <svg class="box" id="box" viewBox="0 0 200 200" role="button" tabindex="0" aria-label="Toca la caja para abrir">
    <rect x="42" y="92" width="116" height="86" rx="10" fill="var(--box)"/>
    <rect x="42" y="92" width="116" height="20" rx="10" fill="var(--box-dark)" opacity=".35"/>
    <rect x="91" y="92" width="18" height="86" fill="var(--box-dark)"/>
    <g id="lid">
      <rect x="34" y="72" width="132" height="28" rx="8" fill="var(--box-light)"/>
      <rect x="91" y="72" width="18" height="28" fill="var(--box-dark)"/>
      <path d="M100 74 C72 44, 58 76, 100 80 C142 76, 128 44, 100 74 Z" fill="var(--box-light)" stroke="var(--box-dark)" stroke-width="2"/>
      <circle cx="100" cy="76" r="8" fill="var(--box-dark)"/>
    </g>
  </svg>
  <h2 class="g-title">Toca la caja</h2>
  <p class="g-sub">Dale 6 veces para abrir tu sorpresa 💛</p>
  <div class="g-progress" id="g-progress"></div>
  <div class="g-count" id="g-count">0 / 6</div>
</div>

<script>
  // --------- Construir girasoles ---------
  (function(){
    var field = document.getElementById("field");
    var SVGNS = "http://www.w3.org/2000/svg";
    function flowerSVG(d){
      var s = document.createElementNS(SVGNS,"svg");
      s.setAttribute("viewBox","0 0 100 100"); s.setAttribute("width",d); s.setAttribute("height",d);
      var petals="";
      for(var i=0;i<18;i++){
        petals += '<ellipse cx="50" cy="16" rx="6.5" ry="17" fill="var(--petal)" stroke="var(--petal-dark)" stroke-width="1" transform="rotate('+(i*20)+' 50 50)"/>';
      }
      var dots="";
      for(var k=0;k<5;k++){ dots += '<circle cx="'+(50+(Math.random()*18-9))+'" cy="'+(50+(Math.random()*18-9))+'" r="1.6" fill="var(--center-dot)"/>'; }
      s.innerHTML = petals + '<circle cx="50" cy="50" r="18" fill="var(--center)"/>' + dots;
      return s;
    }
    // posiciones: x%, altura del tallo, tamaño de flor, balanceo
    var specs = [
      {x:6,  h:150, d:96,  a:2.6, dur:5.0},
      {x:20, h:210, d:120, a:2.0, dur:6.2},
      {x:34, h:120, d:82,  a:3.0, dur:4.6},
      {x:48, h:250, d:140, a:1.7, dur:7.0},
      {x:62, h:170, d:104, a:2.4, dur:5.6},
      {x:76, h:130, d:88,  a:2.8, dur:4.9},
      {x:88, h:220, d:124, a:1.9, dur:6.6},
      {x:95, h:160, d:98,  a:2.5, dur:5.4}
    ];
    specs.forEach(function(sp,i){
      var wrap = document.createElement("div");
      wrap.className = "sunflower";
      wrap.style.left = sp.x + "%";
      wrap.style.setProperty("--a", sp.a + "deg");
      wrap.style.animation = "sway " + sp.dur + "s ease-in-out infinite";
      wrap.style.animationDelay = (-i*0.5) + "s";

      var stem = document.createElement("div");
      stem.className = "stem"; stem.style.height = sp.h + "px";
      wrap.appendChild(stem);

      var leaf1 = document.createElement("div");
      leaf1.className = "leaf"; leaf1.style.bottom = (sp.h*0.45)+"px"; leaf1.style.transform="translateX(-100%) rotate(18deg)";
      var leaf2 = document.createElement("div");
      leaf2.className = "leaf"; leaf2.style.bottom = (sp.h*0.60)+"px"; leaf2.style.transform="translateX(0) rotate(-18deg) scaleX(-1)";
      wrap.appendChild(leaf1); wrap.appendChild(leaf2);

      var head = document.createElement("div");
      head.className = "head"; head.style.bottom = (sp.h - sp.d*0.35) + "px";
      head.style.marginLeft = (-sp.d/2) + "px"; head.style.left = "50%";
      head.appendChild(flowerSVG(sp.d));
      wrap.appendChild(head);

      field.appendChild(wrap);
    });
  })();

  // --------- Corazones amarillos subiendo ---------
  var heartsStarted = false;
  function startHearts(){
    if(heartsStarted) return; heartsStarted = true;
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c = document.getElementById("hearts"), ctx = c.getContext("2d");
    var HP = new Path2D("M12 21s-7.5-4.8-10-9.3C.4 8.6 1.9 5 5.2 5c2 0 3.3 1.1 4.1 2.3C10.1 6.1 11.4 5 13.4 5c3.3 0 4.8 3.6 3.2 6.7C19.5 16.2 12 21 12 21z");
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    function resize(){ c.width = innerWidth*dpr; c.height = innerHeight*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
    resize(); addEventListener("resize", resize);
    function mk(init){ return { x:Math.random()*innerWidth, y: init? Math.random()*innerHeight : innerHeight+24, s:10+Math.random()*18, v:14+Math.random()*26, sway:Math.random()*Math.PI*2, amp:10+Math.random()*26, op:0.35+Math.random()*0.45 }; }
    var N = Math.max(12, Math.round(Math.min(26, innerWidth/20)));
    var hearts = []; for(var i=0;i<N;i++) hearts.push(mk(true));
    var last = performance.now();
    function frame(t){
      var dt = Math.min((t-last)/1000, 0.05); last = t;
      ctx.clearRect(0,0,innerWidth,innerHeight);
      for(var j=0;j<hearts.length;j++){
        var h = hearts[j];
        h.y -= h.v*dt; h.sway += dt*1.3;
        var x = h.x + Math.sin(h.sway)*h.amp;
        if(h.y < -30){ hearts[j] = mk(false); continue; }
        ctx.save(); ctx.translate(x, h.y); var k = h.s/24; ctx.scale(k,k);
        ctx.globalAlpha = h.op; ctx.fillStyle = Math.random()<0.5? "#ffcf33" : "#ffd95e";
        ctx.fill(HP); ctx.restore();
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // --------- Música ---------
  (function(){
    var audio = document.getElementById("bg-audio");
    var btn = document.getElementById("music-btn");
    var ON = '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>';
    var OFF = '<path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><line x1="3" y1="3" x2="21" y2="21" stroke="currentColor" stroke-width="2.4"/>';
    btn.addEventListener("click", function(){
      if(audio.paused){ audio.play().catch(function(){}); }
      else { audio.pause(); }
    });
    audio.addEventListener("play", function(){ btn.querySelector("svg").innerHTML = ON; });
    audio.addEventListener("pause", function(){ btn.querySelector("svg").innerHTML = OFF; });
  })();

  // --------- Caja: 6 clics para abrir ---------
  (function(){
    var TAPS = 6;
    var gift = document.getElementById("gift");
    var box = document.getElementById("box");
    var lid = document.getElementById("lid");
    var prog = document.getElementById("g-progress");
    var countEl = document.getElementById("g-count");
    var audio = document.getElementById("bg-audio");
    var HEART = '<path d="M12 21s-7.5-4.8-10-9.3C.4 8.6 1.9 5 5.2 5c2 0 3.3 1.1 4.1 2.3C10.1 6.1 11.4 5 13.4 5c3.3 0 4.8 3.6 3.2 6.7C19.5 16.2 12 21 12 21z"/>';
    var SVGNS = "http://www.w3.org/2000/svg";
    var pips = [];
    for(var i=0;i<TAPS;i++){
      var s = document.createElementNS(SVGNS,"svg");
      s.setAttribute("viewBox","0 0 24 24"); s.setAttribute("fill","currentColor"); s.setAttribute("aria-hidden","true");
      s.innerHTML = HEART; prog.appendChild(s); pips.push(s);
    }
    document.documentElement.classList.add("lock");
    var taps = 0, done = false;

    function pop(){
      for(var k=0;k<7;k++){
        (function(){
          var e = document.createElement("div");
          e.textContent = "💛";
          e.style.cssText = "position:fixed;left:50%;top:42%;z-index:101;pointer-events:none;font-size:"+(13+Math.random()*16)+"px;transform:translate(-50%,-50%);transition:transform 1s ease,opacity 1s ease";
          document.body.appendChild(e);
          requestAnimationFrame(function(){
            var dx=(Math.random()-0.5)*200, dy=-80-Math.random()*150;
            e.style.transform="translate("+dx+"px,"+dy+"px) rotate("+((Math.random()-0.5)*70)+"deg)";
            e.style.opacity="0";
          });
          setTimeout(function(){ e.remove(); }, 1100);
        })();
      }
    }

    function tap(){
      if(done) return;
      taps++;
      if(pips[taps-1]) pips[taps-1].classList.add("on");
      countEl.textContent = taps + " / " + TAPS;
      box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      lid.style.transform = "translateY(" + (-6*taps) + "px) rotate(" + (-2*taps) + "deg)";
      pop();
      if(taps >= TAPS){
        done = true;
        lid.style.transform = "translateY(-170px) rotate(-32deg)";
        lid.style.opacity = "0";
        audio.play().catch(function(){});
        startHearts();
        setTimeout(function(){
          gift.classList.add("gone");
          document.documentElement.classList.remove("lock");
          document.getElementById("scene").setAttribute("aria-hidden","false");
        }, 520);
        setTimeout(function(){ gift.style.display = "none"; }, 1600);
      }
    }
    box.addEventListener("click", tap);
    box.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); tap(); } });
  })();
</script>
